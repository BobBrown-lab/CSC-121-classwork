name: app
type: python:3.10
build:
  flavor: none
hooks:
  build: |
    pip install --upgrade pip
    pip install -r requirements.txt
  deploy: |
    python manage.py migrate
web:
  upstream:
    socket_family: unix
  commands:
    start: "gunicorn -w 4 -b unix:$SOCKET learning_log.wsgi:application"
  locations:
    "/":
      passthru: true
    "/static":
      root: "static"
      allow: true
      expires: 1h